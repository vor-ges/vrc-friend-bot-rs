[package]
name = "vrc-friend-bot-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of vor-ges/vrc-friend-bot"

[profile.release]
strip = true # 配布用の実行ファイルから記号を除く (約21MB -> 約18MB)

[features]
default = ["bot"]
# Discord / WebSocket / 実行ファイル。ロジックだけ試すときは --no-default-features で速くビルドできる
bot = ["dep:serenity", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:dotenvy", "dep:env_logger"]

[[bin]]
name = "vrc-friend-bot"
path = "src/main.rs"
required-features = ["bot"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.9"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
unicode-general-category = "1"

serenity = { version = "0.12", optional = true, default-features = false, features = ["builder", "client", "gateway", "http", "model", "utils", "rustls_backend"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.21", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
dotenvy = { version = "0.15", optional = true }
env_logger = { version = "0.11", optional = true, default-features = false, features = ["humantime"] }
